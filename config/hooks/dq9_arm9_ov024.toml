# Unlimited quests (see dq9_arm9.toml; handler src/hooks/quest_limit.cpp):
# 0x021DF71C matches the accepted quests against a 7-entry table of
# battle-condition quests, walking the slots from mgr+4.
version = 1

[program]
bank = "dq9_arm9_ov024"
sha1 = "e0502f5dee15044ee0dc3c8342ecb1223dd47568"

[[hook]]
address = 0x021DF770      # add r0, r11, #4 (each iteration)
mode = "arm"
name = "Dq9QuestSlotBase"
registers = ["r0"]
when = "after"

# Battle multipliers (handler src/hooks/battle_multipliers.cpp): the action
# executor 0x021EB5D0 stores the final damage of one hit (0x021E6A90) at
# sp+0x54, which it hands to the action-type handler that applies and shows
# it; sp+0xD2 / sp+0xD0 = attacker / target actor ids (s16).
[[hook]]
address = 0x021EC7AC      # str r0, [sp, #0x54]
mode = "arm"
name = "Dq9BattleDamageScale"
registers = ["r0", "sp"]
