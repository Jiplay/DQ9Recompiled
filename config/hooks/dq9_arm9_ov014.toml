# Mouse-friendly menus. Handler: src/hooks/mouse_menus.cpp; see
# dq9_arm9_ov003.toml (part 5, layout menus) for the guest code.
version = 1

[program]
bank = "dq9_arm9_ov014"
sha1 = "0e024b076a50f50c327f7d3fab53480ec80343fd"

[[hook]]
address = 0x02186F44      # cmp r1, #0 (r1 = press edge; scene at 0x02186F10)
mode = "arm"
name = "Dq9MouseMenuTapPress"
registers = ["r1", "sp"]

# The Defeated Monster List keeps its cursor at *(s+0xD0) (s+0x172 the
# category, s+0x176 the monster). Every frame, before the keypad step
# (0x0208010C, which leaves what it did in s+0x160), 0x02186BC8 saves the
# cursor in s+0x178. The state then redraws the other screen (the monster's
# info, or the category's page) when s+0x160 is set or the cursor differs
# from s+0x178, and only after that runs the pen step 0x02186F10. A cursor
# the pen step moves is therefore saved as "already shown" on the next
# frame, and the info stays on the old entry. Once the mouse hover has
# moved the cursor, the next frame's check sees s+0x160 set.
[[hook]]
address = 0x02186FC4      # ldr r0, [r4, #0xc0] (the pen step moved the cursor)
mode = "arm"
name = "Dq9MouseMenuRecordsMoved"

[[hook]]
address = 0x02187EA8      # cmps r1, #0 (r1 = s+0x160; category list)
mode = "arm"
name = "Dq9MouseMenuRecordsRedraw"
registers = ["r1"]

[[hook]]
address = 0x02188150      # cmps r3, #0 (r3 = s+0x160; monster list)
mode = "arm"
name = "Dq9MouseMenuRecordsRedraw"
registers = ["r3"]
