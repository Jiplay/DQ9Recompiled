name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      publish_mode: release
      tag: ${{ github.ref_name }}
    secrets: inherit

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # A full (non-pre) release: /releases/latest, which the self-updater
      # polls, returns it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DQ9Recomp ${{ github.ref_name }}"
          body: "You must own the game: put your Europe (YDQP) ROM next to the executable on first launch. See the [README](https://github.com/${{ github.repository }}#readme).\n\n"
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
