[game]
name = "Dragon Quest IX: Sentinels of the Starry Skies"
id = "YDQP"
region = "Europe"
revision = 0
status = "static-scan banks: ARM9 main, ARM7, 31 overlays (Tier-3 interpreter fallback)"
rom = "dq9.nds"
rom_size = 0x10000000
sha1 = "ff761d349709f329c8ac4bd0023fdce21861e8a1"

[display]
# One window showing only the DS main screen (engine A's LCD). Backtick
# shows the other screen; holding Tab (the virtual stylus) peeks at it.
screen_layout = "single"     # single | stacked | separate
window_mode = "letterbox"    # letterbox | stretch | original (1:1)
scaling = "nearest"          # nearest | bilinear | integer (pixel-perfect)
# 3D detail as a % of the window's resolution (>100 supersamples). Replace
# with internal_resolution = N to pin a fixed multiplier instead.
resolution_scale = 100

[system]
startup_mode = "automatic"
# Firmware user language, which YDQP uses to pick its text language:
# english, french, german, italian or spanish (or "preserve" to keep the
# firmware dump's own). Override per run with NDS_LANGUAGE or --language.
language = "english"

# 64 KiB EEPROM, confirmed from a working emulator save of YDQP (a raw
# 65,536-byte image starting "DRAGON QUEST IX"). The runner reads and writes
# the same raw format (dq9.sav next to the ROM, or --save-path).
[cartridge]
save_type = "eeprom"
save_size = 65536

[arm9]
rom_offset = 0x00004000
entry_pc = 0x02000800
load_address = 0x02000000
compressed_size = 0x0009bd08
decompressed_size = 0x000f4618
overlay_count = 35

[arm7]
rom_offset = 0x001e2400
entry_pc = 0x02380000
load_address = 0x02380000
size = 0x00028fc4

[framework]
path = "ndsrecomp"
