# Text the hooks add to the game, one table per screen. Every language needs
# every key; a missing one falls back to English. Codes are the languages
# DQ9 has text for (en fr de it es); scripts/gen-lang.py embeds them.
name = "English"

[main_menu]
options = "Options"
import_save = "Import save file"
export_save = "Export save file"
# Shown when a newer release is out (src/hooks/options_row.cpp); {} is
# its version.
update = "Update to {}"

# The Misc. list's Options row (src/hooks/camp_options.cpp).
[camp_menu]
options_description = "Change the display, audio, input and game settings."

# The Options pages (src/hooks/options_row.cpp). Keys are built from the
# runtime menu's rows: cat_<section>, <row key with _ for .>, v_<choice>,
# each lower case with _ for anything but letters and digits. A row or
# choice without a key shows the runtime menu's English text. Accents use
# the game's own tags (<'e> <`a> <:u> <^e> <,c> <~n> <ss>).
[options]
cat_display = "Display"
cat_audio = "Audio"
cat_input = "Input"
cat_game = "Game"
cat_netplay = "Netplay"
back = "Back"
v_on = "On"
v_off = "Off"
v_local = "Local"
v_online = "Online"
display_scaling = "Scaling"
display_resolution_scale = "Resolution scale"
display_second_screen_size = "Second screen size"
display_show_fps = "Show FPS"
display_smooth_3d = "Smooth 3D"
audio_volume = "Volume"
audio_mute = "Mute"
input_gamepad_layout = "Gamepad layout"
input_mouse_sensitivity = "Mouse sensitivity"
title_skip_intros = "Skip intros"
title_camera_mode = "Camera zoom"
title_camera_distance = "Manual camera distance"
title_unlock_camera_rotation = "Unlock camera rotation"
title_language = "Language"
title_ui_size = "UI size"
title_mouse_friendly = "Mouse-friendly menus"
title_fps_mode = "60 FPS mode"
netplay_enabled = "Netplay"
v_letterbox = "Letterbox"
v_stretch = "Stretch"
v_original_1_1 = "Original (1:1)"
v_integer_pixel_perfect = "Integer"
v_bilinear = "Bilinear"
v_nearest_neighbor = "Nearest neighbor"
v_off_fixed = "Off"
v_fast = "Fast"
v_accurate = "Accurate"
v_by_label = "By label"
v_by_position = "By position"
v_auto = "Auto"
v_scale_with_window = "Scale with window"
v_system = "System"
v_english = "English"
v_french = "Fran<,c>ais"
v_german = "Deutsch"
v_italian = "Italiano"
v_spanish = "Espa<~n>ol"
# d_<key>: the description shown under the page, at most three lines of
# about 36 characters (a tag counts as one).
d_cat_display = "Window, scaling and 3D resolution."
d_cat_audio = "Volume and mute."
d_cat_input = "Gamepad and mouse."
d_cat_game = "Camera, language, menus and intros."
d_cat_netplay = "Play online. Hosting and joining use the game's own multiplayer menus."
d_display_scaling = "Integer keeps whole pixels, bilinear smooths, nearest stays pixelated at any size."
d_display_resolution_scale = "3D detail relative to the window: 100% matches the screen, more is sharper."
d_display_second_screen_size = "The other screen beside the main one, as a percent of its size. 0 hides it."
d_display_show_fps = "Shows the 3D images drawn per second in a corner of the screen."
d_display_smooth_3d = "Blends in-between 3D images. Shows 3D one frame later and may glitch."
d_audio_volume = "Output level in percent."
d_audio_mute = "Silences all sound."
d_input_gamepad_layout = "By label, pad A is DS A. By position, the pad's right button is DS A."
d_input_mouse_sensitivity = "How fast the pointer follows the mouse."
d_title_skip_intros = "Skips the logos and the opening movie when the game starts."
d_title_camera_mode = "Auto follows the window size. Manual uses the distance set with the mouse wheel or the right stick."
d_title_camera_distance = "How far the camera sits in Manual zoom. Above 100% zooms out."
d_title_unlock_camera_rotation = "Lets L and R turn the field camera all the way round. L+R resets it."
d_title_language = "The game's text language. A menu that is open changes when reopened."
d_title_ui_size = "Keeps text boxes and menus at a fixed size, so a big window shows more of the scene."
d_title_mouse_friendly = "Highlights the entry under the mouse and chooses it with one click."
d_title_fps_mode = "Fast blends images in between (3D a frame late, may glitch). Accurate draws them all; needs a fast PC."
d_netplay_enabled = "Local: the local network. Online: lobbies through the lobby server."
d_netplay_account = "The lobby server needs a Discord account."
